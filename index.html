<body>
<noscript><div class="noscript-notice">Для работы сайта включите JavaScript · Для роботи сайту увімкніть JavaScript</div></noscript>
<button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">☰<span class="sr-only">Открыть меню</span></button>

<aside id="sidebar">
  <div id="sidebar-head">
    <h1 id="app-title">Математика 10–11</h1>
    <p id="app-subtitle">Тригонометрия · Показательная и логарифмическая функции · Анализ · Интегралы</p>
    <div class="head-controls">
      <div class="lang-switch">
        <button id="btn-lang-ru" class="active">RU</button>
        <button id="btn-lang-ua">UA</button>
      </div>
      <button id="btn-theme-toggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">☀</button>
    </div>
    <div class="grade-switch">
      <button id="btn-grade-junior" data-grade="junior">1–4</button>
      <button id="btn-grade-middle" data-grade="middle">5–9</button>
      <button id="btn-grade-senior" class="active" data-grade="senior">10–11</button>
    </div>
    <div class="sidebar-search">
      <label class="sr-only" for="lesson-search">Поиск уроков и формул</label>
      <input id="lesson-search" type="search" autocomplete="off" placeholder="Поиск уроков и формул">
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </div>
  </div>
  <div class="mode-switch">
    <button id="btn-mode-course" class="active">Курс</button>
    <button id="btn-mode-trainer">Тренажёр</button>
  </div>
  <nav id="module-nav" aria-label="Навигация по урокам"></nav>
</aside>

<main id="main"></main>

<div id="mascot-wrap">
  <div id="mascot-bubble" class="mascot-bubble" role="status" aria-live="polite"></div>
  <button id="mascot-avatar" type="button" title="Квантик" aria-label="Квантик">
    <svg width="100%" height="100%" viewBox="0 0 100 100" focusable="false" aria-hidden="true">
      <defs>
        <linearGradient id="mgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" class="mascot-grad-1"/>
          <stop offset="55%" class="mascot-grad-2"/>
          <stop offset="100%" class="mascot-grad-3"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" class="mascot-base"/>
      <circle cx="50" cy="50" r="46" class="mascot-body"/>
      <ellipse cx="50" cy="18" rx="34" ry="10" class="mascot-orbit" transform="rotate(-18 50 18)"/>
      <circle cx="18" cy="10" r="4" class="mascot-orbit-dot" transform="rotate(-18 50 18)"/>
      <circle cx="32" cy="42" r="6" class="mascot-eye"/>
      <circle cx="68" cy="42" r="6" class="mascot-eye"/>
      <circle cx="34" cy="40" r="2" class="mascot-eye-glint"/>
      <circle cx="70" cy="40" r="2" class="mascot-eye-glint"/>
      <path d="M32 62 Q50 76 68 62" class="mascot-mouth"/>
    </svg>
    <span id="mascot-ping" aria-hidden="true"></span>
  </button>
</div>

<script src="i18n.js" defer></script>
<script src="lessons.js" defer></script>
<script src="trainer.js" defer></script>
<script src="app.js" defer></script>

</body>
</html>
