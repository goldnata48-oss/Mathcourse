  <style>
/* 2026 Наталия Кравченко. Все права защищены. Образовательный курс — «Маткурс» */
:root{
    --paper:#F5F6F7;
    --surface:#FFFFFF;
    --ink:#1D1F23;
    --ink-soft:#5B616B;
    --line:#E1E4E8;
    --sidebar-bg:#FFFFFF;
    --sidebar-border:#E1E4E8;
    --sidebar-ink:#33383F;
    --sidebar-ink-soft:#767C87;
    --accent:#33415C;
    --accent-soft:#E7EAF0;
    --amber:#5B6472;
    --amber-soft:#ECEEF1;
    --error:#A23B34;
    --error-soft:#F5E4E2;
    --blue:#3D5A80;
    --blue-soft:#E7ECF2;
    --purple:#4A4E69;
    --purple-soft:#EAEAEF;
    --coral:#6E4E4A;
    --coral-soft:#EFE7E5;
    --teal:#3C6E62;
    --teal-soft:#E5EFEC;
    --success:#2F6F4F;
    --success-soft:#E3EEE8;
    --serif: Iowan Old Style, Palatino Linotype, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"]{
    --paper:#18191C;
    --surface:#212327;
    --ink:#E7E9EC;
    --ink-soft:#9AA0AC;
    --line:#2C2F35;
    --sidebar-bg:#17181B;
    --sidebar-border:#2A2C31;
    --sidebar-ink:#DCDFE4;
    --sidebar-ink-soft:#888E99;
    --accent:#8593AC;
    --accent-soft:#262B34;
    --amber:#9BA3B0;
    --amber-soft:#25272C;
    --error:#D2756D;
    --error-soft:#302321;
    --blue:#7C93B8;
    --blue-soft:#20262F;
    --purple:#8C90AC;
    --purple-soft:#25252E;
    --coral:#A88E88;
    --coral-soft:#292321;
    --teal:#7DAA9B;
    --teal-soft:#1E2724;
    --success:#4C9A72;
    --success-soft:#1B2A22;
  }

  /* ---------- ВІКОВІ ПАЛІТРИ (1–4 та 5–9 клас) ---------- */
  /* 10–11 (НМТ) лишається без змін — це базова строга тема вище */
  [data-grade="junior"]{
    --sidebar-bg:linear-gradient(165deg, #FF7A45 0%, #FF3D71 55%, #9B5DE5 100%);
    --sidebar-border:transparent;
    --sidebar-ink:#FFF3EA;
    --sidebar-ink-soft:#FFE3D3;
    --accent:#FF6A3D;
    --accent-soft:#FFE7DC;
    --amber:#FFB020;
    --amber-soft:#FFF2D6;
    --blue:#12B6E0;
    --blue-soft:#DBF6FC;
    --purple:#9B5DE5;
    --purple-soft:#F1E5FC;
    --coral:#FF3D71;
    --coral-soft:#FFE1EB;
    --teal:#0FD9A8;
    --teal-soft:#D8FBF0;
    --success:#2F9E63;
    --success-soft:#E3F7EC;
  }
  [data-grade="middle"]{
    --sidebar-bg:#1F2A44;
    --sidebar-border:rgba(255,255,255,.14);
    --sidebar-ink:#EAF0FB;
    --sidebar-ink-soft:#9FB0D0;
    --accent:#2F86C7;
    --accent-soft:#E3F0FB;
    --amber:#E8A33D;
    --amber-soft:#FBEEDA;
    --blue:#2F86C7;
    --blue-soft:#E3F0FB;
    --purple:#8B5CF6;
    --purple-soft:#EDE7FD;
    --coral:#E85D75;
    --coral-soft:#FBE4E8;
    --teal:#22A699;
    --teal-soft:#DFF3F1;
    --success:#2F9E63;
    --success-soft:#E3F7EC;
  }

/* 2026 Наталия Кравченко. Все права защищены. Образовательный курс — «Маткурс» */
*{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  :root{
    --sa-t:0px;--sa-r:0px;--sa-b:0px;--sa-l:0px;
    --mascot-inset:22px;
    --mascot-size:60px;
    --kb-inset:0px;
    --mascot-bubble-max:240px;
  }
  @supports (top:env(safe-area-inset-top)){
    :root{
      --sa-t:env(safe-area-inset-top);
      --sa-r:env(safe-area-inset-right);
      --sa-b:env(safe-area-inset-bottom);
      --sa-l:env(safe-area-inset-left);
    }
  }
  .noscript-notice{padding:16px;margin:16px auto;max-width:640px;border:1px solid var(--sidebar-border);border-radius:10px;font-weight:600;background:var(--amber-soft);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .mobile-menu-toggle{display:none;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    color:var(--sidebar-ink);
    border-right:1px solid var(--sidebar-border);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
    overflow-y:auto;
  }
  #sidebar-head{
    padding:24px 20px 18px;
    border-bottom:1px solid var(--sidebar-border);
  }
  #sidebar-head h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:22px;
    margin:0 0 4px;
    color:var(--sidebar-ink);
    line-height:1.2;
  }
  #sidebar-head p{
    margin:0;
    font-size:12.5px;
    color:var(--sidebar-ink-soft);
    font-weight:500;
  }
  .head-controls{display:flex;gap:6px;margin-top:16px;align-items:center;}
  .lang-switch{
    display:flex;
    gap:6px;
    flex:1;
  }
  .lang-switch button{
    flex:1;
    padding:7px 0;
    background:transparent;
    border:1px solid var(--sidebar-border);
    color:var(--sidebar-ink-soft);
    border-radius:7px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:var(--sans);
  }
  .lang-switch button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .grade-switch{display:flex;gap:6px;margin-top:8px;}
  .grade-switch button{
    flex:1;
    padding:6px 0;
    background:transparent;
    border:1px solid var(--sidebar-border);
    color:var(--sidebar-ink-soft);
    border-radius:7px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--sans);
  }
  .grade-switch button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .sidebar-search{padding:12px 20px 0;position:relative;}
  .sidebar-search input{width:100%;padding:9px 11px;border:1px solid var(--sidebar-border);border-radius:8px;background:var(--surface);color:var(--ink);font:13px var(--sans);}
  .sidebar-search input:focus{outline:none;border-color:var(--accent);}
  .search-results{display:none;position:absolute;top:calc(100% + 4px);left:20px;right:20px;z-index:10;max-height:320px;overflow:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.14);}
  .search-results.visible{display:block;}
  .search-result{display:block;width:100%;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:12.5px var(--sans);}
  .search-result:last-child{border-bottom:0;}
  .search-result:hover{background:var(--accent-soft);}
  .search-result small{display:block;margin-top:3px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-empty{padding:10px;color:var(--ink-soft);font-size:12.5px;}
  .theme-toggle{
    width:34px;height:34px;
    flex-shrink:0;
    border:1px solid var(--sidebar-border);
    background:transparent;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    color:var(--sidebar-ink-soft);
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .mode-switch{
    display:flex;
    gap:8px;
    padding:16px 20px 8px;
  }
  .mode-switch button{
    flex:1;
    padding:10px 0;
    background:transparent;
    border:1px solid var(--sidebar-border);
    color:var(--sidebar-ink-soft);
    border-radius:8px;
    font-size:13.5px;
    cursor:pointer;
    font-family:var(--sans);
    font-weight:700;
  }
  .mode-switch button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  nav#module-nav{padding:8px 10px 24px;}
  .module-block{margin-top:14px;border-left:2px solid var(--sidebar-border);padding-left:6px;}
  [data-grade="junior"] .module-block:nth-of-type(1),
  [data-grade="middle"] .module-block:nth-of-type(1){border-left-color:var(--amber);}
  [data-grade="junior"] .module-block:nth-of-type(2),
  [data-grade="middle"] .module-block:nth-of-type(2){border-left-color:var(--blue);}
  [data-grade="junior"] .module-block:nth-of-type(3),
  [data-grade="middle"] .module-block:nth-of-type(3){border-left-color:var(--purple);}
  [data-grade="junior"] .module-block:nth-of-type(4),
  [data-grade="middle"] .module-block:nth-of-type(4){border-left-color:var(--coral);}
  [data-grade="junior"] .module-block:nth-of-type(5),
  [data-grade="middle"] .module-block:nth-of-type(5){border-left-color:var(--teal);}
  .module-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--sidebar-ink-soft);
    padding:6px 10px 4px;
    font-weight:700;
  }
  .module-progress{padding:0 10px 7px;color:var(--sidebar-ink-soft);font-size:10px;font-family:var(--mono);}
  .module-progress-track{height:4px;margin-top:4px;border-radius:999px;background:var(--accent-soft);overflow:hidden;}
  .module-progress-fill{height:100%;border-radius:inherit;background:var(--success);transition:width .2s ease;}
  .lesson-item{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--sidebar-ink);
    padding:9px 10px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    font-family:var(--sans);
    line-height:1.35;
  }
  .lesson-item:hover{background:var(--accent-soft);}
  .lesson-item.active{background:var(--accent);color:#fff;font-weight:700;}
  .lesson-item.disabled{color:var(--sidebar-ink-soft);opacity:.55;cursor:default;}
  .lesson-item.disabled:hover{background:transparent;}
  .lesson-num{
    width:20px;height:20px;flex-shrink:0;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--sidebar-ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:var(--mono);
  }
  .lesson-item.active .lesson-num{background:rgba(255,255,255,.25);color:#fff;}
  .lesson-item.done .lesson-num{background:var(--sidebar-ink);color:var(--sidebar-bg);}
  .soon-tag, .test-tag{
    margin-left:auto;
    font-size:10px;
    color:var(--sidebar-ink-soft);
    font-family:var(--mono);
    border:1px solid var(--sidebar-border);
    padding:1px 6px;
    border-radius:999px;
  }

  /* ---------- MAIN ---------- */
  #main{flex:1;min-width:0;padding:44px 48px calc(104px + var(--sa-b));max-width:900px;background:var(--paper);}
  .lesson-header{margin-bottom:32px;}
  .lesson-kicker{
    display:inline-block;
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    padding:5px 14px;
    border-radius:999px;
    letter-spacing:.03em;
    margin-bottom:12px;
  }
  [data-grade="junior"] .lesson-kicker,
  [data-grade="middle"] .lesson-kicker{
    color:#fff;
    background:linear-gradient(120deg, var(--coral), var(--accent));
    border:none;
  }
  .lesson-header h2{
    font-family:var(--serif);
    font-size:34px;
    font-weight:700;
    margin:0 0 8px;
    line-height:1.15;
    max-width:22ch;
    color:var(--ink);
  }
  .lesson-navigation{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px;}
  .lesson-navigation .btn{padding:8px 12px;font-size:12.5px;}
  .lesson-navigation .btn:disabled{opacity:.45;cursor:default;}
  [data-grade="junior"] .lesson-header h2,
  [data-grade="middle"] .lesson-header h2{
    background:linear-gradient(90deg, var(--coral) 0%, var(--accent) 45%, var(--amber) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .lesson-meta{font-size:13px;color:var(--ink-soft);}
  .content{max-width:680px;font-size:16px;line-height:1.65;}
  .content p{margin:0 0 16px;}
  .content h3{
    font-family:var(--serif);
    font-size:20px;
    margin:32px 0 14px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:9px;
  }
  .content h3::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .formula-box{
    position:relative;
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:14px 18px;
    margin:16px 0;
    font-family:var(--mono);
    font-size:16px;
    border-radius:0 8px 8px 0;
  }
  .formula-bookmark{position:absolute;top:8px;right:8px;padding:3px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;}
  .formula-bookmark:hover,.formula-bookmark.active{color:var(--amber);background:var(--surface);border-color:var(--line);}
  .lesson-status{margin-left:auto;font-size:11px;color:var(--success);font-family:var(--mono);}
  .formula-box + .formula-box{margin-top:8px;}
  /* чередование цветов — только для младших возрастных палитр, 10–11 остаётся строгой */
  [data-grade="junior"] .formula-box:nth-of-type(2n),
  [data-grade="middle"] .formula-box:nth-of-type(2n){background:var(--blue-soft);border-left-color:var(--blue);}
  [data-grade="junior"] .formula-box:nth-of-type(3n),
  [data-grade="middle"] .formula-box:nth-of-type(3n){background:var(--purple-soft);border-left-color:var(--purple);}
  [data-grade="junior"] .formula-box:nth-of-type(4n),
  [data-grade="middle"] .formula-box:nth-of-type(4n){background:var(--teal-soft);border-left-color:var(--teal);}

  .example-box{
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:8px;
    padding:16px 18px;
    margin:14px 0;
    background:var(--surface);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  [data-grade="junior"] .example-box:nth-of-type(2n),
  [data-grade="middle"] .example-box:nth-of-type(2n){border-left-color:var(--coral);}
  [data-grade="junior"] .example-box:nth-of-type(3n),
  [data-grade="middle"] .example-box:nth-of-type(3n){border-left-color:var(--blue);}
  .example-box .ex-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:5px;
    font-size:11px;
    letter-spacing:.02em;
    color:#fff;
    font-weight:700;
    margin-bottom:8px;
    background:var(--accent);
  }
  [data-grade="junior"] .example-box:nth-of-type(2n) .ex-label,
  [data-grade="middle"] .example-box:nth-of-type(2n) .ex-label{background:var(--coral);}
  [data-grade="junior"] .example-box:nth-of-type(3n) .ex-label,
  [data-grade="middle"] .example-box:nth-of-type(3n) .ex-label{background:var(--blue);}
  .example-box .ex-math{font-family:var(--mono);font-size:15px;line-height:1.7;}

  /* ---------- ТАБЛИЦЫ ---------- */
  /* структура: первая строка — «шапка» (значения углов), первый столбец каждой строки — подпись (th) */
  table.value-table{
    border-collapse:separate;
    border-spacing:0;
    margin:18px 0;
    font-size:15px;
    width:100%;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 0 1px var(--line);
  }
  table.value-table th,table.value-table td{
    padding:10px 12px;
    text-align:center;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  table.value-table th:last-child,table.value-table td:last-child{border-right:none;}
  table.value-table tr:last-child th,table.value-table tr:last-child td{border-bottom:none;}

  /* первая строка целиком — шапка */
  table.value-table tr:first-child th,
  table.value-table tr:first-child td{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.02em;
    border-color:rgba(255,255,255,.15);
  }
  [data-grade="junior"] table.value-table tr:first-child th,
  [data-grade="junior"] table.value-table tr:first-child td,
  [data-grade="middle"] table.value-table tr:first-child th,
  [data-grade="middle"] table.value-table tr:first-child td{
    background:linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
    color:#fff;
  }

  /* первый столбец начиная со 2-й строки — подпись строки */
  table.value-table tr:not(:first-child) th{
    font-family:var(--sans);
    font-weight:700;
    color:var(--ink);
    background:var(--accent-soft);
    font-size:14px;
  }
  [data-grade="junior"] table.value-table tr:not(:first-child) th,
  [data-grade="middle"] table.value-table tr:not(:first-child) th{
    color:#fff;
    background:var(--amber);
  }

  /* сами данные */
  table.value-table tr:not(:first-child) td{
    font-family:var(--mono);
    font-weight:600;
    color:var(--ink);
    background:var(--surface);
  }
  table.value-table tr:nth-of-type(2n):not(:first-child) td{background:var(--paper);}
  [data-grade="junior"] table.value-table tr:nth-of-type(3n-1):not(:first-child) td,
  [data-grade="middle"] table.value-table tr:nth-of-type(3n-1):not(:first-child) td{background:var(--accent-soft);}
  [data-grade="junior"] table.value-table tr:nth-of-type(3n):not(:first-child) td,
  [data-grade="middle"] table.value-table tr:nth-of-type(3n):not(:first-child) td{background:var(--blue-soft);}
  [data-grade="junior"] table.value-table tr:nth-of-type(3n+1):not(:first-child) td,
  [data-grade="middle"] table.value-table tr:nth-of-type(3n+1):not(:first-child) td{background:var(--purple-soft);}

  .interactive-block{
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin:24px 0;
    background:var(--surface);
    border-top:3px solid var(--accent);
  }

  /* mini-check */
  .check-block{

  .q-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);}

  .mis-exp{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink-soft);font-size:13px;line-height:1.45;}

  /* trainer */
  .trainer-topic-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

  .topic-card{

  .topic-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .topic-level{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;

    border-radius:999px;

  .topic-card h4{margin:0 0 6px;font-family:var(--serif);font-size:17px;color:var(--ink);}
  .topic-card p{margin:0;font-size:13px;color:var(--ink-soft);}
  .resources-section{margin-top:42px;padding-top:24px;border-top:1px solid var(--line);}
  .resources-section h3{font-family:var(--serif);font-size:22px;margin:0 0 16px;color:var(--ink);}
  .resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .resource-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface);}
  .resource-card h4{margin:0 0 7px;font-family:var(--serif);font-size:16px;color:var(--ink);}
  .resource-card p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .resource-card details{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .resource-card summary{cursor:pointer;color:var(--accent);font-weight:700;}
  .video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:7px;background:var(--paper);margin-top:8px;}
  .trainer-run{max-width:600px;}
  .trainer-score{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .trainer-q{
    font-family:var(--mono);
    font-size:20px;
    margin-bottom:14px;
    line-height:1.5;
    color:var(--ink);
  }
  .hint-btn{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:7px 13px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:14px;
    font-family:var(--sans);
  }
  .hint-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .hint-text{
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:10px 14px;
    border-radius:0 8px 8px 0;
    font-size:13.5px;
    color:var(--ink);
    margin-bottom:14px;
  }
  .trainer-input-row{display:flex;gap:10px;margin-bottom:14px;}
  .trainer-input-row input{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:var(--mono);
    font-size:15px;
    background:var(--surface);
    color:var(--ink);
  }
  .trainer-input-row input:focus{outline:none;border-color:var(--accent);}
  .btn{
    padding:11px 20px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--sans);
  }
  .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .feedback{
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
    margin-bottom:14px;
    font-weight:700;
  }
  .feedback.correct{background:var(--success-soft);color:var(--success);}
  .feedback.wrong{background:var(--error-soft);color:var(--error);}
  .back-link{
    display:inline-block;
    margin-bottom:16px;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .back-link:hover{color:var(--accent);}

  circle.drag-point{cursor:grab;}
  circle.drag-point:active{cursor:grabbing;}

  /* ---------- АЛГОРИТМИ (БЛОК-СХЕМИ) ---------- */
  .algo-diagram{
    margin:20px 0;
    padding:20px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--paper);
  }
  .algo-step{
    border:2px solid var(--accent);
    background:var(--accent-soft);
    border-radius:10px;
    padding:12px 16px;
    text-align:center;
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.5;
    max-width:460px;
    margin:0 auto;
    color:var(--ink);
  }
  .algo-step.algo-start{
    border-style:solid;
    border-radius:999px;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .algo-step.algo-decision{
    border-color:var(--amber);
    background:var(--amber-soft);
    border-style:dashed;
  }
  .algo-step.algo-end{
    border-color:var(--success);
    background:var(--success-soft);
    font-weight:700;
  }
  .algo-arrow{
    text-align:center;
    color:var(--ink-soft);
    font-size:20px;
    line-height:1;
    margin:2px 0;
  }
  .algo-branch-row{
    display:flex;
    gap:18px;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-top:2px;
  }
  .algo-branch-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
    min-width:190px;
  }
  .algo-branch-label{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .algo-mini-table{
    font-family:var(--mono);
    font-size:12.5px;
    text-align:left;
    line-height:1.7;
  }

  /* ---------- ИТОГОВЫЙ ТЕСТ МОДУЛЯ ---------- */
  .test-level-heading{
    font-family:var(--serif);
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin:32px 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .test-q{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:14px;
    background:var(--surface);
  }
  .test-q-text{font-size:15px;font-family:var(--mono);margin-bottom:10px;color:var(--ink);}
  .test-q-options{display:flex;flex-direction:column;gap:6px;}
  .test-opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .test-input{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:var(--mono);
    font-size:14.5px;
    background:var(--surface);
    color:var(--ink);
  }
  .test-feedback{padding:8px 12px;border-radius:6px;font-size:13.5px;margin-top:10px;font-weight:600;}
  .test-feedback.correct{background:var(--success-soft);color:var(--success);}
  .test-feedback.wrong{background:var(--error-soft);color:var(--error);}
  .test-q-correct{border-left:3px solid var(--success);}
  .test-q-wrong{border-left:3px solid var(--error);}
  .test-summary-box{
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:24px;
    background:var(--accent-soft);
  }
  .test-summary-total{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .test-summary-row{font-size:13.5px;color:var(--ink-soft);font-family:var(--mono);}
  .test-timer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);color:var(--ink-soft);font-family:var(--mono);font-size:13px;}
  .test-timer-value{font-weight:700;color:var(--accent);}
  .test-timer.warning .test-timer-value{color:var(--error);}

  /* ---------- МАСКОТ КВАНТИК ---------- */
  #mascot-wrap{
    position:fixed;
    right:calc(var(--mascot-inset) + var(--sa-r));
    bottom:calc(var(--mascot-inset) + var(--sa-b) + var(--kb-inset));
    z-index:1002;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    width:var(--mascot-size);
    pointer-events:none;
    transition:transform .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #mascot-avatar{
    width:var(--mascot-size);
    height:var(--mascot-size);
    border-radius:50%;
    border:2px solid var(--accent);
    padding:0;
    cursor:pointer;
    background:var(--surface);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
    position:relative;
    flex-shrink:0;
    pointer-events:auto;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:transform .15s ease, box-shadow .15s ease, width .2s ease, height .2s ease;
  }
  @media (hover:hover){
    #mascot-avatar:hover{transform:scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.2);}
  }
  @media (hover:none){
    #mascot-avatar:active{transform:scale(.92);}
  }
  #mascot-avatar svg{display:block;width:100%;height:100%;}
  #mascot-avatar:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .mascot-grad-1{stop-color:var(--amber);}
  .mascot-grad-2{stop-color:var(--accent);}
  .mascot-grad-3{stop-color:var(--purple);}
  .mascot-base{fill:var(--accent);stroke:var(--ink);stroke-width:3;}
  .mascot-body{fill:url(#mgrad);stroke:var(--ink);stroke-width:3;}
  .mascot-orbit{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:.55;}
  .mascot-orbit-dot{fill:var(--ink);}
  .mascot-eye{fill:var(--ink);}
  .mascot-eye-glint{fill:var(--surface);}
  .mascot-mouth{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;}
  [data-grade="junior"] #mascot-avatar{
    animation:mascot-float 2.6s ease-in-out infinite;
    border-width:3px;
  }
  [data-grade="junior"] #mascot-avatar:hover{animation-play-state:paused;}
  @keyframes mascot-float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }
  #mascot-ping{
    position:absolute;
    top:1px; right:1px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--success);
    border:2px solid var(--surface);
    display:none;
    pointer-events:none;
  }
  #mascot-ping.show{display:block;animation:mascot-pulse 1.4s ease-in-out infinite;}
  @keyframes mascot-pulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.3);opacity:.6;}
  }
  .mascot-bubble{
    position:absolute;
    right:0;
    bottom:calc(100% + 12px);
    width:max-content;
    max-width:calc(100vw - var(--mascot-inset) * 2 - var(--sa-l) - var(--sa-r));
    max-width:var(--mascot-bubble-max, 240px);
    max-height:38vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px 14px 4px 14px;
    padding:12px 15px;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    font-weight:500;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
    opacity:0;
    visibility:hidden;
    transform:translateY(10px) scale(.94);
    transform-origin:bottom right;
    pointer-events:none;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .mascot-bubble.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
    pointer-events:auto;
    cursor:pointer;
  }
  .mascot-bubble .mascot-name{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:700;
    color:var(--accent);
    margin-bottom:3px;
  }
  body.kb-open #mascot-wrap{--mascot-size:46px;}
  @media (prefers-reduced-motion:reduce){
    [data-grade="junior"] #mascot-avatar{animation:none;}
    #mascot-ping.show{animation:none;}
    .mascot-bubble{transition:opacity .12s linear;}
  }

  @media (max-width:840px){
    body{display:block;}
    .mobile-menu-toggle{display:block;position:fixed;top:calc(12px + var(--sa-t));left:calc(12px + var(--sa-l));z-index:1001;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12);}
    body.sidebar-open .mobile-menu-toggle{left:calc(min(320px,86vw) - 52px);}
    #sidebar{width:min(320px,86vw);height:100vh;position:fixed;top:0;left:0;z-index:1000;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 24px rgba(0,0,0,.16);padding-top:var(--sa-t);}
    body.sidebar-open #sidebar{transform:translateX(0);}
    #main{max-width:none;padding:calc(68px + var(--sa-t)) 20px calc(112px + var(--sa-b));}
    #mascot-wrap{--mascot-inset:14px;--mascot-size:52px;}
    .mascot-bubble{font-size:13px;max-height:34vh;}
    body.sidebar-open #mascot-wrap{
      opacity:0;
      visibility:hidden;
      transform:translateY(14px);
      pointer-events:none;
    }
  }
  @media (max-width:840px) and (max-height:520px){
    #mascot-wrap{--mascot-size:44px;}
    .mascot-bubble{max-height:44vh;font-size:12.5px;padding:9px 12px;}
  }
  @media (max-width:359px){
    #mascot-wrap{--mascot-size:46px;}
    .mascot-bubble{font-size:12.5px;padding:10px 12px;}
  }

  </style>
</head>
<body>
<noscript><div class="noscript-notice">Для работы сайта включите JavaScript · Для роботи сайту увімкніть JavaScript</div></noscript>
<button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">☰<span class="sr-only">Открыть меню</span></button>

      <label class="sr-only" for="lesson-search">Поиск уроков и формул</label>

    <svg width="100%" height="100%" viewBox="0 0 100 100" focusable="false" aria-hidden="true">
      <defs>
        <linearGradient id="mgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" class="mascot-grad-1"/>
          <stop offset="55%" class="mascot-grad-2"/>
          <stop offset="100%" class="mascot-grad-3"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" class="mascot-base"/>
      <circle cx="50" cy="50" r="46" class="mascot-body"/>
      <ellipse cx="50" cy="18" rx="34" ry="10" class="mascot-orbit" transform="rotate(-18 50 18)"/>
      <circle cx="18" cy="10" r="4" class="mascot-orbit-dot" transform="rotate(-18 50 18)"/>
      <circle cx="32" cy="42" r="6" class="mascot-eye"/>
      <circle cx="68" cy="42" r="6" class="mascot-eye"/>
      <circle cx="34" cy="40" r="2" class="mascot-eye-glint"/>
      <circle cx="70" cy="40" r="2" class="mascot-eye-glint"/>

  <script>
/* 2026 Наталия Кравченко. Все права защищены. Образовательный курс — «Маткурс» */
const UI = {

    function el(tag, attrs){ const e=document.createElementNS(ns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSurface = cssVar('--surface');
    svg.appendChild(el("line",{x1:10,y1:cy,x2:250,y2:cy,stroke:cLine,"stroke-width":1.5}));

    svg.appendChild(el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:cInk,"stroke-width":2}));
    const radiusLine = el("line",{x1:cx,y1:cy,x2:cx+R,y2:cy,stroke:cAccent,"stroke-width":3});
    svg.appendChild(radiusLine);
    const point = el("circle",{cx:cx+R,cy:cy,r:9,fill:cAccent,stroke:cSurface,"stroke-width":2,class:"drag-point"});
    svg.appendChild(point);

    const readout = root.querySelector("#circle-readout");
    function render(angle){
      angle = ((angle % (2*Math.PI))+2*Math.PI) % (2*Math.PI);
      const x = cx + R*Math.cos(angle);
      const y = cy - R*Math.sin(angle);
      radiusLine.setAttribute("x2",x); radiusLine.setAttribute("y2",y);
      point.setAttribute("cx",x); point.setAttribute("cy",y);
      const deg = angle*180/Math.PI;
      const L = UI[lang];
      readout.innerHTML = `
        <div><span>${L.angle} (°)</span>${fmtNum(deg)}°</div>
        <div><span>${L.angle} (${L.radians})</span>${fmtNum(angle)}</div>
        <div><span>${L.point}</span>(${fmtNum(Math.cos(angle))}; ${fmtNum(Math.sin(angle))})</div>
      `;
    }
    render(0);
    let dragging=false;
    function angleFromEvent(evt){
      const rect = svg.getBoundingClientRect();
      const clientX = evt.touches? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches? evt.touches[0].clientY : evt.clientY;
      const x = (clientX-rect.left) * (260/rect.width);
      const y = (clientY-rect.top) * (260/rect.height);
      return Math.atan2(-(y-cy), x-cx);
    }
    point.addEventListener("pointerdown", e=>{ dragging=true; point.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", e=>{ if(dragging) render(angleFromEvent(e)); });
    svg.addEventListener("pointerup", ()=>{ dragging=false; });

  mount(root, lang){

    const readout = root.querySelector("#expo-a-readout");
    const cv = root.querySelector("#expo-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260, baseY=H-16, xScale=W/6, yMax=10, yScale=(H-30)/yMax;
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent');
    const L = { ru:{a:"Основание", inc:"функция возрастает", dec:"функция убывает"}, ua:{a:"Основа", inc:"функція зростає", dec:"функція спадає"} }[lang];

    function draw(a){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,baseY); ctx.lineTo(W,baseY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
      ctx.strokeStyle=cAccent; ctx.lineWidth=2.5; ctx.beginPath();
      let started=false;
      for(let px=0; px<=W; px++){
        const x = (px-W/2)/xScale;
        let y = Math.pow(a,x);
        if(y>yMax) y=yMax;
        const py = baseY - y*yScale;
        if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
      }
      ctx.stroke();
      // точка (0;1)
      const py1 = baseY - 1*yScale;
      ctx.fillStyle=cInk;
      ctx.beginPath(); ctx.arc(W/2, py1, 4, 0, 2*Math.PI); ctx.fill();
      const status = a>1 ? L.inc : L.dec;
      readout.innerHTML = `<div><span>${L.a}</span>a = ${a.toFixed(1)}</div><div><span>y = aˣ</span>${status}</div>`;
    }
    draw(parseFloat(slider.value));
    slider.addEventListener("input", ()=>{ draw(parseFloat(slider.value)); });

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"Область значений функции y = aˣ:",ua:"Область значень функції y = aˣ:"}, opts:["y ∈ ℝ","y > 0","y ≥ 0","y < 0"], correct:1 },

      for(let px=axisX+2; px<=W; px++){
        const x = (px-axisX)/xScale;
        let y = Math.log(x)/Math.log(a);
        if(y>yClamp) y=yClamp; if(y<-yClamp) y=-yClamp;
        const py = midY - y*yScale;
        if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const px1 = axisX + 1*xScale;
      ctx.fillStyle=cInk;
      ctx.beginPath(); ctx.arc(px1, midY, 4, 0, 2*Math.PI); ctx.fill();
      const status = a>1 ? L.inc : L.dec;
      readout.innerHTML = `<div><span>${L.a}</span>a = ${a.toFixed(1)}</div><div><span>y = logₐx</span>${status}</div>`;
    }
    draw(parseFloat(slider.value));
    slider.addEventListener("input", ()=>{ draw(parseFloat(slider.value)); });

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"log₅ 25 равен:",ua:"log₅ 25 дорівнює:"}, opts:["1","2","5","25"], correct:1 },
      { q:{ru:"logₐ(x·y) равен:",ua:"logₐ(x·y) дорівнює:"}, opts:["logₐx · logₐy","logₐx + logₐy","logₐx − logₐy","(logₐx)^y"], correct:1 },

  mount(root, lang){
    const sel = root.querySelector("#gr-transform-select");
    const slider = root.querySelector("#gr-param-slider");
    const paramRow = root.querySelector("#gr-param-row");
    const paramLabel = root.querySelector("#gr-param-label");
    const readout = root.querySelector("#gr-readout");
    const cv = root.querySelector("#gr-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260, midY=H/2, xScale=W/6, yScale=18, yClamp=7;
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSoft = cssVar('--ink-soft');
    const base = x => Math.pow(2,x);
    const LBL = { ru:{c:"Параметр c", k:"Параметр k"}, ua:{c:"Параметр c", k:"Параметр k"} }[lang];

    function transformed(x, kind, p){
      if(kind==="add") return base(x)+p;
      if(kind==="shiftx") return base(x+p);
      if(kind==="kmul") return p*base(x);
      if(kind==="kx") return base(p*x);
      if(kind==="negf") return -base(x);
      if(kind==="fnegx") return base(-x);
      return base(x);
    }
    function plot(fn, color, dashed){
      ctx.setLineDash(dashed?[5,4]:[]);
      ctx.strokeStyle=color; ctx.lineWidth=dashed?1.5:2.5; ctx.beginPath();
      let started=false;
      for(let px=0; px<=W; px++){
        const x=(px-W/2)/xScale;
        let y=fn(x);
        if(y>yClamp) y=yClamp; if(y<-yClamp) y=-yClamp;
        const py=midY-y*yScale;
        if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    function draw(){
      const kind = sel.value;
      const needsParam = kind!=="negf" && kind!=="fnegx";
      paramRow.style.display = needsParam ? "block" : "none";
      paramLabel.textContent = (kind==="kmul"||kind==="kx") ? LBL.k : LBL.c;
      let p = parseFloat(slider.value);
      if((kind==="kmul"||kind==="kx") && Math.abs(p)<0.1) p = p<0?-0.1:0.1;
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,midY); ctx.lineTo(W,midY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
      plot(base, cSoft, true);
      plot(x=>transformed(x,kind,p), cAccent, false);
      readout.innerHTML = needsParam ? `<div><span>${paramLabel.textContent}</span>${p.toFixed(1)}</div>` : "";
    }
    sel.addEventListener("change", draw);
    slider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"y = f(x) − 3 — это сдвиг графика:",ua:"y = f(x) − 3 — це зсув графіка:"}, opts:["вверх на 3","вниз на 3","влево на 3","вправо на 3"], correct:1 },
      { q:{ru:"y = f(x + 2) — это сдвиг графика:",ua:"y = f(x + 2) — це зсув графіка:"}, opts:["вправо на 2","вверх на 2","влево на 2","вниз на 2"], correct:2 },
      { q:{ru:"y = −f(x) получается отражением относительно:",ua:"y = −f(x) отримується відображенням відносно:"}, opts:["оси Oy","оси Ox","прямой y=x","начала координат"], correct:1 },
      { q:{ru:"y = f(−x) получается отражением относительно:",ua:"y = f(−x) отримується відображенням відносно:"}, opts:["оси Oy","оси Ox","прямой y=x","начала координат"], correct:0 }
    ]);
  }
},

    // f(x) = (x^2-4)/(x-2), эквивалентно x+2 при x≠2
    function px(x){ return x*xScale; }
    function py(y){ return yBase - y*yScale; }

      const nearTwo = Math.abs(x-2)<0.001;

      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;

      let started=false;

    const W=600, H=260;
    const xMin=-1, xMax=3, yMin=-1, yMax=5;
    const xScale = W/(xMax-xMin), yScale = H/(yMax-yMin);
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSoft = cssVar('--ink-soft'), cSurface = cssVar('--surface');

      if(Math.abs(dx)<0.02) dx = dx<0?-0.02:0.02;

  mount(root, lang){
    const sel = root.querySelector("#der2-fn-select");
    const readout = root.querySelector("#der2-readout");
    const cv = root.querySelector("#der2-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260;
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSoft = cssVar('--ink-soft');
    const FUNCS = {
      x2:   { f:x=>x*x,        fp:x=>2*x,      xMin:-3, xMax:3, yMin:-1, yMax:9,  label:{ru:"f(x)=x², f′(x)=2x",ua:"f(x)=x², f′(x)=2x"} },
      x3:   { f:x=>x*x*x-3*x,  fp:x=>3*x*x-3,  xMin:-3, xMax:3, yMin:-5, yMax:5,  label:{ru:"f(x)=x³−3x, f′(x)=3x²−3",ua:"f(x)=x³−3x, f′(x)=3x²−3"} },
      sinx: { f:Math.sin,      fp:Math.cos,    xMin:-6.3, xMax:6.3, yMin:-1.6, yMax:1.6, label:{ru:"f(x)=sin x, f′(x)=cos x",ua:"f(x)=sin x, f′(x)=cos x"} },
      ex:   { f:Math.exp,      fp:Math.exp,    xMin:-2, xMax:2, yMin:-0.5, yMax:7.5, label:{ru:"f(x)=eˣ, f′(x)=eˣ",ua:"f(x)=eˣ, f′(x)=eˣ"} }
    };
    function draw(){
      const cfg = FUNCS[sel.value];
      const xScale = W/(cfg.xMax-cfg.xMin), yScale = H/(cfg.yMax-cfg.yMin);
      const px = x => (x-cfg.xMin)*xScale;
      const py = y => H - (y-cfg.yMin)*yScale;
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),0); ctx.lineTo(px(0),H); ctx.stroke();
      function plot(fn,color,dashed){
        ctx.setLineDash(dashed?[5,4]:[]);
        ctx.strokeStyle=color; ctx.lineWidth=2.3; ctx.beginPath();
        let started=false;
        for(let i=0;i<=W;i++){
          const x = cfg.xMin+i/xScale;
          let y = fn(x);
          if(y>cfg.yMax) y=cfg.yMax; if(y<cfg.yMin) y=cfg.yMin;
          const pxx=i, pyy=py(y);
          if(!started){ ctx.moveTo(pxx,pyy); started=true; } else ctx.lineTo(pxx,pyy);
        }
        ctx.stroke(); ctx.setLineDash([]);
      }
      plot(cfg.f, cInk, false);
      plot(cfg.fp, cAccent, true);
      readout.textContent = cfg.label[lang];
    }
    sel.addEventListener("change", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"(x⁵)′ равна:",ua:"(x⁵)′ дорівнює:"}, opts:["5x⁴","x⁴","5x⁶","x⁵"], correct:0 },
      { q:{ru:"(sin x)′ равна:",ua:"(sin x)′ дорівнює:"}, opts:["cos x","−cos x","−sin x","1/cos²x"], correct:0 },
      { q:{ru:"(uv)′ равна:",ua:"(uv)′ дорівнює:"}, opts:["u′v′","u′v+uv′","u′v−uv′","u′+v′"], correct:1 },
      { q:{ru:"(eˣ)′ равна:",ua:"(eˣ)′ дорівнює:"}, opts:["xeˣ⁻¹","eˣ","eˣ·ln e","0"], correct:1 },
      { q:{ru:"Производная sin(5x) по правилу цепочки равна:",ua:"Похідна sin(5x) за правилом ланцюжка дорівнює:"}, opts:["cos(5x)","5cos(5x)","cos(5x)/5","5cos x"], correct:1 }
    ]);
  }
},

  mount(root, lang){

    const cv = root.querySelector("#inv-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260;
    const xMin=-2.5, xMax=2.5, yMin=-3, yMax=3;
    const xScale=W/(xMax-xMin), yScale=H/(yMax-yMin);
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSuccess = cssVar('--success'), cError = cssVar('--error'), cSurface = cssVar('--surface');
    const f = x => x*x*x-3*x;
    const fp = x => 3*x*x-3;
    const px = x => (x-xMin)*xScale;
    const py = y => H-(y-yMin)*yScale;
    const L = { ru:{x:"x", fx:"f(x)", fpx:"f′(x)", inc:"зростає", dec:"спадає", crit:"критична точка!"},
                ua:{x:"x", fx:"f(x)", fpx:"f′(x)", inc:"зростає", dec:"спадає", crit:"критична точка!"} }[lang];
    function draw(){
      const x = parseFloat(slider.value);
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),0); ctx.lineTo(px(0),H); ctx.stroke();
      // кривая, окрашенная по знаку производной
      let started=false, prevSign=null;
      for(let i=0;i<=W;i++){
        const xx = xMin+i/xScale;
        const yy = f(xx);
        const sign = fp(xx)>=0 ? 1 : -1;
        if(sign!==prevSign){
          if(started) ctx.stroke();
          ctx.strokeStyle = sign>0 ? cSuccess : cError;
          ctx.lineWidth=2.3;
          ctx.beginPath();
          ctx.moveTo(px(xx),py(yy));
          started=true; prevSign=sign;
        } else {
          ctx.lineTo(px(xx),py(yy));
        }
      }
      ctx.stroke();
      // критические точки
      [-1,1].forEach(cx=>{
        ctx.fillStyle=cSurface; ctx.strokeStyle=cInk; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(px(cx),py(f(cx)),5,0,2*Math.PI); ctx.fill(); ctx.stroke();
      });
      // текущая точка
      const fx=f(x), fpx=fp(x);
      ctx.fillStyle=cAccent;
      ctx.beginPath(); ctx.arc(px(x),py(fx),6,0,2*Math.PI); ctx.fill();
      const nearCrit = Math.abs(x-1)<0.05 || Math.abs(x+1)<0.05;
      const status = nearCrit ? L.crit : (fpx>0 ? L.inc : L.dec);
      readout.innerHTML = `<div><span>${L.x}</span>${x.toFixed(2)}</div><div><span>${L.fpx}</span>${fpx.toFixed(2)}</div><div style="flex-basis:100%;font-size:12px;">${status}</div>`;
    }
    slider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"Если f′(x)>0 на промежутке, функция на нём:",ua:"Якщо f′(x)>0 на проміжку, функція на ньому:"}, opts:["возрастает","убывает","постоянна","не определена"], correct:0 },

      { q:{ru:"Для y=x²−6x+5 точка минимума:",ua:"Для y=x²−6x+5 точка мінімуму:"}, opts:["x=3","x=6","x=−3","x=0"], correct:0 }
    ]);
  }

    const W=600, H=260;
    const xMin=-2.5, xMax=2.5, yMin=-2, yMax=8;
    const xScale=W/(xMax-xMin), yScale=H/(yMax-yMin);
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cSoft = cssVar('--ink-soft');
    const px = x => (x-xMin)*xScale;
    const py = y => H-(y-yMin)*yScale;
    const L = { ru:{c:"C", note:"F′(x)=2x всегда — независимо от C!"}, ua:{c:"C", note:"F′(x)=2x завжди — незалежно від C!"} }[lang];
    function plotCurve(C, color, width, dashed){
      ctx.setLineDash(dashed?[4,4]:[]);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
      let started=false;
      for(let i=0;i<=W;i++){
        const x = xMin+i/xScale;
        let y = x*x+C;
        if(y>yMax) y=yMax; if(y<yMin) y=yMin;
        const pxx=i, pyy=py(y);
        if(!started){ ctx.moveTo(pxx,pyy); started=true; } else ctx.lineTo(pxx,pyy);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    function draw(){
      const C = parseFloat(slider.value);
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),0); ctx.lineTo(px(0),H); ctx.stroke();
      [-2,-1,0,1,2,3].forEach(ghost=>{ if(ghost!==C) plotCurve(ghost, cSoft, 1, true); });

      readout.innerHTML = `<div><span>${L.c}</span>${C.toFixed(1)}</div><div style="flex-basis:100%;font-size:12px;">${L.note}</div>`;

      { q:{ru:"Почему в неопределённом интеграле пишут +C?",ua:"Чому в невизначеному інтегралі пишуть +C?"}, opts:["для красоты записи","первообразных бесконечно много, они отличаются на константу","это ошибка, C не нужно","C всегда равно нулю"], correct:1 }
    ]);
  }
},

  mount(root, lang){

    const W=600, H=260;

    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cAccentSoft = cssVar('--accent-soft');
    const f = x => x*x;
    const exact = 8/3;
    const px = x => (x-a)*xScale;
    const py = y => H-(y-yMin)*yScale;
    const L = { ru:{n:"n (прямоугольников)", sum:"Сумма прямоугольников", exact:"Точное значение"},
                ua:{n:"n (прямокутників)", sum:"Сума прямокутників", exact:"Точне значення"} }[lang];
    function draw(){
      const n = parseInt(slider.value);
      const dx = (b-a)/n;
      ctx.clearRect(0,0,W,H);
      // прямоугольники (правило правых точек)
      let sum = 0;
      for(let i=1;i<=n;i++){
        const xi = a+i*dx;
        const hi = f(xi);
        sum += hi*dx;
        ctx.fillStyle = cAccentSoft;
        ctx.strokeStyle = cAccent;
        ctx.lineWidth = 1;
        const x0 = px(a+(i-1)*dx), x1 = px(xi);
        ctx.fillRect(x0, py(hi), x1-x0, py(0)-py(hi));
        ctx.strokeRect(x0, py(hi), x1-x0, py(0)-py(hi));
      }
      // кривая
      ctx.strokeStyle=cInk; ctx.lineWidth=2.5; ctx.beginPath();
      let started=false;
      for(let i=0;i<=W;i++){

        const y = f(x);
        const pxx=i, pyy=py(y);
        if(!started){ ctx.moveTo(pxx,pyy); started=true; } else ctx.lineTo(pxx,pyy);
      }
      ctx.stroke();
      // оси
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),0); ctx.lineTo(px(0),H); ctx.stroke();

      readout.innerHTML = `<div><span>${L.n}</span>${n}</div><div><span>${L.sum}</span>${sum.toFixed(4)}</div><div><span>${L.exact}</span>${exact.toFixed(4)} (8/3)</div>`;

    ]);

},

      <div class="check-block"><h3>${t.checkTitle}</h3><div id="mini-check"></div></div>
    `;
  },
  mount(root, lang){
    const slider = root.querySelector("#area-x-slider");
    const readout = root.querySelector("#area-readout");
    const cv = root.querySelector("#area-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260;
    const xMin=-0.2, xMax=1.2, yMin=-0.1, yMax=1.2;
    const xScale=W/(xMax-xMin), yScale=H/(yMax-yMin);
    const cLine = cssVar('--line'), cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cAccentSoft = cssVar('--accent-soft'), cSoft = cssVar('--ink-soft');
    const f = x=>x, g = x=>x*x;
    const px = x=>(x-xMin)*xScale;
    const py = y=>H-(y-yMin)*yScale;
    const areaExact = 1/6;
    const L = { ru:{x:"x", h:"Высота полоски f(x)−g(x)", area:"Площадь всей фигуры"},
                ua:{x:"x", h:"Висота смужки f(x)−g(x)", area:"Площа всієї фігури"} }[lang];
    function plot(fn,color){
      ctx.strokeStyle=color; ctx.lineWidth=2.3; ctx.beginPath();
      let started=false;
      for(let i=0;i<=W;i++){
        const x=xMin+i/xScale, y=fn(x);
        const pxx=i, pyy=py(y);
        if(!started){ ctx.moveTo(pxx,pyy); started=true; } else ctx.lineTo(pxx,pyy);
      }
      ctx.stroke();
    }
    function draw(){
      const xs = parseFloat(slider.value);
      ctx.clearRect(0,0,W,H);
      // заливка области между кривыми на [0,1]
      ctx.fillStyle=cAccentSoft;
      ctx.beginPath();
      ctx.moveTo(px(0),py(f(0)));
      for(let i=0;i<=100;i++){ const x=i/100; ctx.lineTo(px(x),py(f(x))); }
      for(let i=100;i>=0;i--){ const x=i/100; ctx.lineTo(px(x),py(g(x))); }
      ctx.closePath(); ctx.fill();
      // оси
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),0); ctx.lineTo(px(0),H); ctx.stroke();
      plot(f, cInk); plot(g, cSoft);
      // текущая полоска
      const yf=f(xs), yg=g(xs);
      ctx.strokeStyle=cAccent; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(px(xs),py(yf)); ctx.lineTo(px(xs),py(yg)); ctx.stroke();
      readout.innerHTML = `<div><span>${L.x}</span>${xs.toFixed(2)}</div><div><span>${L.h}</span>${(yf-yg).toFixed(4)}</div><div><span>${L.area}</span>${areaExact.toFixed(4)} (1/6)</div>`;
    }
    slider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"Если f(x)≤0 на [a;b], площадь равна:",ua:"Якщо f(x)≤0 на [a;b], площа дорівнює:"}, opts:["∫[a;b]f(x)dx","−∫[a;b]f(x)dx","0","f(b)−f(a)"], correct:1 },
      { q:{ru:"Площадь между f(x) и g(x) (f сверху) на [a;b]:",ua:"Площа між f(x) і g(x) (f зверху) на [a;b]:"}, opts:["∫[a;b]f(x)dx","∫[a;b][f(x)−g(x)]dx","∫[a;b][g(x)−f(x)]dx","f(b)−g(a)"], correct:1 },
      { q:{ru:"Первый шаг при нахождении площади между двумя кривыми:",ua:"Перший крок при знаходженні площі між двома кривими:"}, opts:["сразу интегрировать","найти точки пересечения","найти производную","построить касательную"], correct:1 },
      { q:{ru:"Площадь фигуры между y=x и y=x² на [0;1] равна:",ua:"Площа фігури між y=x і y=x² на [0;1] дорівнює:"}, opts:["1/6","1/2","1/3","1"], correct:0 }
    ]);
  }
},

      const scale=22, ox=180, oy=210;
      // основание конуса (эллипс через проекцию окружности)

      for(let i=0;i<=40;i++){
        const th=i/40*2*Math.PI;

      }
      ctx.stroke();
      // апекс

    } : {
      p1:"Якщо криволінійну трапецію під графіком y=f(x) на [a;b] обертати навколо осі Ox, вийде тіло обертання. Його об'єм знаходять тим самим методом, що й площу в модулі «Інтеграли» — тільки тепер складають не смужки, а тонкі диски.",
      f1:"V = π · ∫[a;b] [f(x)]² dx",
      interLabel:"Рухай n — дивись, як сума дисків наближається до об'єму конуса",
      nlP:"Приклад: обертаючи відрізок прямої y=(R/h)x на [0;h] навколо Ox, отримуємо конус.",
      exTitle:"Приклади",
      ex1t:"Виведіть об'єм конуса (R, h) через інтеграл",
      ex1s:"y=(R/h)x. V=π∫[0;h](Rx/h)²dx = πR²/h²·[x³/3]₀ʰ = πR²/h²·h³/3 = ⅓πR²h — та сама формула, що й для піраміди!",

  mount(root, lang){
    const slider = root.querySelector("#s3-n-slider");
    const readout = root.querySelector("#s3-readout");
    const cv = root.querySelector("#s3-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=260;
    const R=2, h=3; // конус: y=(R/h)x на [0,h]
    const exact = (1/3)*Math.PI*R*R*h;
    const xScale=W/(h+0.5), yMid=H/2, yScale=35;
    const cLine=cssVar('--line'), cInk=cssVar('--ink'), cAccent=cssVar('--accent'), cAccentSoft=cssVar('--accent-soft');
    const f = x => (R/h)*x;
    const px = x => x*xScale+20;
    const py = y => yMid - y*yScale;
    const L = { ru:{n:"n (дисков)", sum:"Сумма объёмов дисков", exact:"Точный объём конуса"},
                ua:{n:"n (дисків)", sum:"Сума об'ємів дисків", exact:"Точний об'єм конуса"} }[lang];
    function draw(){
      const n = parseInt(slider.value);
      const dx = h/n;
      ctx.clearRect(0,0,W,H);
      let sum=0;
      for(let i=0;i<n;i++){
        const xi = i*dx + dx/2; // средняя точка
        const ri = f(xi);
        sum += Math.PI*ri*ri*dx;
        ctx.fillStyle=cAccentSoft; ctx.strokeStyle=cAccent; ctx.lineWidth=1;
        const x0=px(i*dx), x1=px((i+1)*dx);
        ctx.fillRect(x0, py(ri), x1-x0, py(-ri)-py(ri));
        ctx.strokeRect(x0, py(ri), x1-x0, py(-ri)-py(ri));
      }
      // контур конуса (верх и низ образующей)
      ctx.strokeStyle=cInk; ctx.lineWidth=2.3;
      ctx.beginPath(); ctx.moveTo(px(0),py(0)); ctx.lineTo(px(h),py(f(h))); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0),py(0)); ctx.lineTo(px(h),py(-f(h))); ctx.stroke();
      ctx.strokeStyle=cLine; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(W,py(0)); ctx.stroke();

      readout.innerHTML = `<div><span>${L.n}</span>${n}</div><div><span>${L.sum}</span>${sum.toFixed(4)}</div><div><span>${L.exact}</span>${exact.toFixed(4)} (⅓π·${R}²·${h})</div>`;
    }
    slider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [
      { q:{ru:"Объём тела вращения находят по формуле:",ua:"Об'єм тіла обертання знаходять за формулою:"}, opts:["π∫f(x)dx","π∫[f(x)]²dx","∫[f(x)]²dx","2π∫f(x)dx"], correct:1 },
      { q:{ru:"Вращение y=√(R²−x²) вокруг Ox даёт:",ua:"Обертання y=√(R²−x²) навколо Ox дає:"}, opts:["конус","цилиндр","шар","тор"], correct:2 },
      { q:{ru:"Вращение прямой y=(R/h)x на [0;h] даёт:",ua:"Обертання прямої y=(R/h)x на [0;h] дає:"}, opts:["цилиндр","конус","шар","призму"], correct:1 },
      { q:{ru:"С ростом n сумма объёмов дисков:",ua:"Зі зростанням n сума об'ємів дисків:"}, opts:["удаляется от точного объёма","приближается к точному объёму","не меняется","всегда равна нулю"], correct:1 }
    ]);
  }
},

  mount(root, lang){
    const slider = root.querySelector("#s4-t-slider");
    const readout = root.querySelector("#s4-readout");
    const cv = root.querySelector("#s4-canvas");
    const ctx = cv.getContext("2d");
    const W=600, H=280;
    const a=2; // ребро куба для картинки
    const cInk=cssVar('--ink'), cAccent=cssVar('--accent'), cLine=cssVar('--line'), cCoral=cssVar('--error');
    const L = { ru:{t:"t", side:"Сторона сечения", area:"Площадь сечения"}, ua:{t:"t", side:"Сторона перерізу", area:"Площа перерізу"} }[lang];

      const tt = parseFloat(slider.value);
      ctx.clearRect(0,0,W,H);
      const scale=55, ox=200, oy=220;
      // вершины куба [0,a]^3, "отсекаемая" вершина - (0,a,0) (верх-перед-лево)
      const V = {
        v000:project3D(0,0,0,ox,oy,scale), v100:project3D(a,0,0,ox,oy,scale),
        v010:project3D(0,a,0,ox,oy,scale), v001:project3D(0,0,a,ox,oy,scale),
        v110:project3D(a,a,0,ox,oy,scale), v101:project3D(a,0,a,ox,oy,scale),
        v011:project3D(0,a,a,ox,oy,scale), v111:project3D(a,a,a,ox,oy,scale)
      };
      // рёбра куба (тонкие)
      const edges = [["v000","v100"],["v100","v110"],["v110","v010"],["v010","v000"],
                      ["v001","v101"],["v101","v111"],["v111","v011"],["v011","v001"],
                      ["v000","v001"],["v100","v101"],["v110","v111"],["v010","v011"]];
      edges.forEach(([p,q])=>draw3DLine(ctx,V[p],V[q],cLine,1.3));
      // секущая плоскость через точки на расстоянии t*a от вершины v010 вдоль трёх рёбер
      const d = tt*a;
      const p1 = project3D(0,a-d,0,ox,oy,scale); // вдоль ребра к v000
      const p2 = project3D(d,a,0,ox,oy,scale);   // вдоль ребра к v110
      const p3 = project3D(0,a,d,ox,oy,scale);   // вдоль ребра к v011
      draw3DPolygon(ctx,[p1,p2,p3], cAccent+"55", cCoral);
      [[p1,p2],[p2,p3],[p3,p1]].forEach(([x,y])=>draw3DLine(ctx,x,y,cCoral,2.5));

      const side = d*Math.SQRT2;
      const area = (Math.sqrt(3)/4)*side*side;
      readout.innerHTML = `<div><span>${L.t}</span>${tt.toFixed(2)}</div><div><span>${L.side}</span>${side.toFixed(2)}</div><div><span>${L.area}</span>${area.toFixed(3)}</div>`;
    }
    slider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#mini-check"), lang, [

    ]);

    const cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cAccentSoft = cssVar('--accent-soft'), cLine = cssVar('--line');

      const L = 200; // основание
      const AC = L*Math.sin(Brad)/Math.sin(Crad);
      const BC = L*Math.sin(Arad)/Math.sin(Crad);
      const ox=100, oy=210;

  mount(root, lang){

    const LBL = { ru:{central:"Центральный угол", internal:"Внутренний угол", sum:"Сумма углов", center:"O", side:"сторон"},
                  ua:{central:"Центральний кут", internal:"Внутрішній кут", sum:"Сума кутів", center:"O", side:"сторін"} }[lang];
    function draw(){
      const n = parseInt(nSlider.value, 10);
      const cx = 200, cy = 160, R = 120;
      const pts = [];
      for(let i=0;i<n;i++){
        const ang = -Math.PI/2 + i*2*Math.PI/n;
        pts.push({x:cx+R*Math.cos(ang), y:cy+R*Math.sin(ang)});
      }
      svg.innerHTML = "";
      const circle = el("circle",{cx,cy,r:R,fill:"none",stroke:cLine,"stroke-width":1.5,"stroke-dasharray":"5 4"});
      svg.appendChild(circle);
      const a0 = -Math.PI/2, a1 = a0 + 2*Math.PI/n;
      const v0 = pts[0], v1 = pts[1];
      const wedge = el("path",{d:`M ${cx},${cy} L ${v0.x.toFixed(1)},${v0.y.toFixed(1)} A ${R},${R} 0 0 1 ${v1.x.toFixed(1)},${v1.y.toFixed(1)} Z`,fill:cAccent,opacity:0.18});
      svg.appendChild(wedge);
      const poly = el("polygon",{points:pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" "),fill:cAccentSoft,stroke:cInk,"stroke-width":2});
      svg.appendChild(poly);
      pts.forEach(p=>{
        const line = el("line",{x1:cx,y1:cy,x2:p.x.toFixed(1),y2:p.y.toFixed(1),stroke:cLine,"stroke-width":1});
        svg.appendChild(line);

      const ctxt = el("text",{x:cx-6,y:cy+4,fill:cInk,"font-size":12,"font-family":"monospace"});

    }
    nSlider.addEventListener("input", draw);
    draw();

    renderMiniCheck(root.querySelector("#geo-polygon-check"), lang, [
      { q:{ru:"Центральный угол правильного квадрата равен:",ua:"Центральний кут правильного квадрата дорівнює:"}, opts:["45°","60°","90°","120°"], correct:2 },
      { q:{ru:"Внутренний угол правильного шестиугольника равен:",ua:"Внутрішній кут правильного шестикутника дорівнює:"}, opts:["60°","90°","120°","150°"], correct:2 },

    ]);
  }

      const scale=28, ox=60, oy=210;
      const A={x:ox,y:oy};
      const B={x:ox+a*scale,y:oy};
      const D={x:ox+b*scale*Math.cos(rad), y:oy-b*scale*Math.sin(rad)};
      const C={x:B.x+D.x-A.x, y:B.y+D.y-A.y};
      svg.innerHTML = "";
      const poly = el("polygon",{points:`${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y} ${D.x},${D.y}`,fill:cAccentSoft,stroke:cInk,"stroke-width":2});

      [el("line",{x1:A.x,y1:A.y,x2:C.x,y2:C.y,stroke:cAccent,"stroke-width":1.5,"stroke-dasharray":"5,4"}),

    const cInk = cssVar('--ink'), cAccent = cssVar('--accent'), cLine = cssVar('--line'), cAccentSoft = cssVar('--accent-soft');
    const L = { ru:{inscribed:"Вписаний кут ACB", central:"Центральний кут AOB"}, ua:{inscribed:"Вписаний кут ACB", central:"Центральний кут AOB"} }[lang];
    const cx=160, cy=160, R=120;
    // фиксированные точки A, B на нижней дуге (в градусах, 0°=вправо, против часовой)
    const angA = 210, angB = 330; // центральный угол малой дуги AB (снизу) = 120°
    function pt(angDeg){
      const rad = angDeg*Math.PI/180;
      return {x: cx+R*Math.cos(rad), y: cy-R*Math.sin(rad)};
    }
    function angleAt(P,Q,S){
      const v1={x:Q.x-P.x,y:Q.y-P.y}, v2={x:S.x-P.x,y:S.y-P.y};
      const dot=v1.x*v2.x+v1.y*v2.y;
      const m1=Math.hypot(v1.x,v1.y), m2=Math.hypot(v2.x,v2.y);
      return Math.acos(dot/(m1*m2))*180/Math.PI;
    }
    function draw(){
      const angC = parseFloat(slider.value);
      const A=pt(angA), B=pt(angB), C=pt(angC), O={x:cx,y:cy};

      const tri = el("polygon",{points:`${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`,fill:cAccentSoft,stroke:cAccent,"stroke-width":2});

      [el("line",{x1:O.x,y1:O.y,x2:A.x,y2:A.y,stroke:cInk,"stroke-width":1.3,"stroke-dasharray":"4,3"}),

        const txt = el("text",{x:p.x+dx,y:p.y+dy,fill:cInk,"font-size":13,"font-family":"monospace"});
        txt.textContent = lab; svg.appendChild(txt);
      });
      const inscribed = angleAt(C,A,B);
      const central = angleAt(O,A,B);
      readout.innerHTML = `<div><span>${L.inscribed}</span>${inscribed.toFixed(1)}°</div><div><span>${L.central}</span>${central.toFixed(1)}°</div>`;
    }

    ]);

    mount(root, lang){
      const COL = {amber:"#e8a33d", teal:"#2aa79b", blue:"#3b82c4", purple:"#8b5fbf", coral:"#e2685f"};
      const cInk = getComputedStyle(root).getPropertyValue("--ink").trim() || "#243447";

      const cPaper = getComputedStyle(root).getPropertyValue("--paper").trim() || "#f7f8fa";
      const MONO = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
      function el(tag, at){ const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for(const k in at) n.setAttribute(k, at[k]); return n; }
      function text(s, str, at){ const n = el("text", at); n.textContent = str; s.appendChild(n); return n; }
      function fmt(x){ return Math.round(x*1000)/1000; }
      function rightAngle(s, x, y, sx, sy, size, color){
        s.appendChild(el("line",{x1:x, y1:y, x2:x + sx*size, y2:y + sy*size, stroke:color, "stroke-width":2}));
        s.appendChild(el("line",{x1:x + sx*size, y1:y + sy*size, x2:x + sx*size - sy*size, y2:y + sy*size + sx*size, stroke:color, "stroke-width":2}));
        s.appendChild(el("line",{x1:x + sx*size - sy*size, y1:y + sy*size + sx*size, x2:x - sy*size, y2:y + sx*size, stroke:color, "stroke-width":2}));
      }

      /* --- статичная фигура: треугольник как половина прямоугольника --- */
      (function drawTri(){
        const s = root.querySelector("#geoArea-tri-svg");
        s.innerHTML = "";
        const R = {x0:20, y0:35, x1:180, y1:135};
        s.appendChild(el("polygon",{points:`${R.x0},${R.y0} ${R.x1},${R.y0} ${R.x1},${R.y1} ${R.x0},${R.y1}`, fill:"none", stroke:cLine, "stroke-width":2, "stroke-dasharray":"5,4"}));
        s.appendChild(el("polygon",{points:`${R.x0},${R.y0} ${R.x0},${R.y1} ${R.x1},${R.y1}`, fill:cAccentSoft, "fill-opacity":0.85, stroke:"none"}));
        s.appendChild(el("polygon",{points:`${R.x0},${R.y0} ${R.x0},${R.y1} ${R.x1},${R.y1}`, fill:"none", stroke:cInk, "stroke-width":2.5}));
        s.appendChild(el("line",{x1:R.x0, y1:R.y0, x2:R.x1, y2:R.y1, stroke:COL.amber, "stroke-width":2.5}));
        text(s, "S = a · h", {x:200, y:60, fill:cInkSoft, "font-size":13, "font-family":MONO});
        text(s, "S / 2", {x:88, y:112, fill:COL.blue, "font-size":14, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "S / 2", {x:140, y:72, fill:cInkSoft, "font-size":13, "font-family":MONO, "text-anchor":"middle"});
        text(s, "диагональ делит прямоугольник на два равных треугольника", {x:210, y:100, fill:cInkSoft, "font-size":12, "font-family":MONO});
        text(s, "Sтр = ½ · a · h", {x:210, y:122, fill:cInk, "font-size":13, "font-family":MONO, "font-weight":700});
      })();

      /* --- статичная фигура: трапеция как сумма двух треугольников --- */
      (function drawTrap(){
        const s = root.querySelector("#geoArea-trap-svg");
        s.innerHTML = "";
        const A = {x:30, y:135}, B = {x:250, y:135}, C = {x:190, y:45}, D = {x:90, y:45};
        s.appendChild(el("polygon",{points:`${D.x},${D.y} ${C.x},${C.y} ${B.x},${B.y} ${A.x},${A.y}`, fill:"none", stroke:cInk, "stroke-width":2.5}));
        s.appendChild(el("polygon",{points:`${D.x},${D.y} ${C.x},${C.y} ${B.x},${B.y}`, fill:cTealSoft, "fill-opacity":0.9, stroke:"none"}));
        s.appendChild(el("polygon",{points:`${D.x},${D.y} ${A.x},${A.y} ${B.x},${B.y}`, fill:cAmberSoft, "fill-opacity":0.9, stroke:"none"}));
        s.appendChild(el("polygon",{points:`${D.x},${D.y} ${C.x},${C.y} ${B.x},${B.y} ${A.x},${A.y}`, fill:"none", stroke:cInk, "stroke-width":2.5}));
        s.appendChild(el("line",{x1:D.x, y1:D.y, x2:A.x, y2:A.y, stroke:COL.teal, "stroke-width":2.5}));
        s.appendChild(el("line",{x1:D.x, y1:D.y, x2:D.x, y2:A.y, stroke:cLine, "stroke-width":2, "stroke-dasharray":"4,3"}));
        rightAngle(s, D.x, A.y, 1, -1, 9, COL.amber);
        text(s, "b", {x:(D.x+C.x)/2, y:D.y - 10, fill:cInk, "font-size":13, "font-family":MONO, "text-anchor":"middle"});
        text(s, "a", {x:(A.x+B.x)/2, y:A.y + 24, fill:cInk, "font-size":13, "font-family":MONO, "text-anchor":"middle"});
        text(s, "h", {x:D.x - 12, y:(D.y+A.y)/2, fill:COL.amber, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "½b·h", {x:(D.x+C.x)/2 - 4, y:78, fill:COL.teal, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "½a·h", {x:190, y:112, fill:COL.amber, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "S = ½b·h + ½a·h = ½(a + b)·h", {x:300, y:96, fill:cInk, "font-size":13, "font-family":MONO, "font-weight":700});
      })();

      /* --- статичная фигура: диагонали ромба --- */
      (function drawRhomb(){
        const s = root.querySelector("#geoArea-rhomb-svg");
        s.innerHTML = "";
        const cx = 150, cy = 100, d1 = 170, d2 = 118;
        const L = {x:cx - d1/2, y:cy}, T = {x:cx, y:cy - d2/2}, Rr = {x:cx + d1/2, y:cy}, B = {x:cx, y:cy + d2/2};
        s.appendChild(el("polygon",{points:`${L.x},${L.y} ${T.x},${T.y} ${Rr.x},${Rr.y} ${B.x},${B.y}`, fill:cPurpleSoft, "fill-opacity":0.75, stroke:"none"}));
        s.appendChild(el("polygon",{points:`${L.x},${L.y} ${T.x},${T.y} ${Rr.x},${Rr.y} ${B.x},${B.y}`, fill:"none", stroke:cInk, "stroke-width":2.5}));
        s.appendChild(el("polygon",{points:`${L.x},${L.y} ${cx},${cy} ${T.x},${T.y}`, fill:cAccentSoft, "fill-opacity":0.9, stroke:"none"}));
        s.appendChild(el("polygon",{points:`${cx},${cy} ${B.x},${B.y} ${Rr.x},${Rr.y}`, fill:cAccentSoft, "fill-opacity":0.9, stroke:"none"}));
        s.appendChild(el("line",{x1:L.x, y1:L.y, x2:Rr.x, y2:Rr.y, stroke:COL.blue, "stroke-width":2.5, "stroke-dasharray":"6,4"}));
        s.appendChild(el("line",{x1:T.x, y1:T.y, x2:B.x, y2:B.y, stroke:COL.coral, "stroke-width":2.5, "stroke-dasharray":"6,4"}));
        s.appendChild(el("polygon",{points:`${L.x},${L.y} ${T.x},${T.y} ${Rr.x},${Rr.y} ${B.x},${B.y}`, fill:"none", stroke:cInk, "stroke-width":2.5}));
        rightAngle(s, cx, cy, 1, -1, 10, COL.amber);
        text(s, "d₁", {x:cx, y:cy - 10, fill:COL.blue, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "d₂", {x:cx + 12, y:cy, fill:COL.coral, "font-size":13, "font-family":MONO, "text-anchor":"start", "font-weight":700});
        text(s, "4 · ½ · (d₁/2) · (d₂/2) = ½·d₁·d₂", {x:160, y:192, fill:cInk, "font-size":12, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
      })();

      /* --- статичная фигура: участок-трапеция из примера 4 --- */
      (function drawPlot(){
        const s = root.querySelector("#geoArea-plot-svg");
        s.innerHTML = "";
        const A = {x:40, y:150}, B = {x:380, y:150}, C = {x:310, y:45}, D = {x:110, y:45};
        s.appendChild(el("polygon",{points:`${D.x},${D.y} ${C.x},${C.y} ${B.x},${B.y} ${A.x},${A.y}`, fill:cTealSoft, "fill-opacity":0.8, stroke:cInk, "stroke-width":2.5}));
        s.appendChild(el("line",{x1:D.x, y1:D.y, x2:D.x, y2:A.y, stroke:COL.amber, "stroke-width":2, "stroke-dasharray":"4,3"}));
        rightAngle(s, D.x, A.y, 1, -1, 9, COL.amber);
        text(s, "40 м", {x:(A.x+B.x)/2, y:172, fill:cInk, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "20 м", {x:(D.x+C.x)/2, y:D.y - 9, fill:cInk, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "25 м", {x:D.x - 8, y:(D.y+A.y)/2, fill:COL.amber, "font-size":13, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
        text(s, "S = 750 м²", {x:210, y:105, fill:COL.teal, "font-size":16, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
      })();

      /* ================= ИНТЕРАКТИВ: калькулятор площади ================= */
      (function interactive(){
        const aIn = root.querySelector("#geoArea-a-slider");
        const hIn = root.querySelector("#geoArea-h-slider");
        const out = root.querySelector("#geoArea-readout");
        const sw = root.querySelector("#geoArea-switch");
        const s = root.querySelector("#geoArea-svg");
        const SHAPES = ["para","tri","trap","rhomb","circle"];
        const NAME = {
          para:{ru:"Параллелограмм", ua:"Паралелограм"},
          tri:{ru:"Треугольник", ua:"Трикутник"},
          trap:{ru:"Трапеция", ua:"Трапеція"},
          rhomb:{ru:"Ромб", ua:"Ромб"},
          circle:{ru:"Круг", ua:"Коло"}
        };
        const NOTE = {
          para:{ru:"Высота измеряется по перпендикуляру — наклон боковой стороны не влияет на площадь.", ua:"Висота вимірюється по перпендикуляру — нахил бічної сторони не впливає на площу."},
          tri:{ru:"Множитель ½ появляется, потому что треугольник — это половина параллелограмма с той же высотой.", ua:"Множник ½ з'являється, бо трикутник — це половина паралелограма з тією ж висотою."},
          trap:{ru:"Верхнее основание здесь вдвое меньше нижнего, поэтому оно и стоит в скобках со знаком «+».", ua:"Верхня основа тут удвічі менша за нижню, тому вона й стоїть у дужках зі знаком «+»."},
          rhomb:{ru:"d₁ и d₂ — диагонали ромба. Формула не зависит от длины стороны, только от диагоналей.", ua:"d₁ і d₂ — діагоналі ромба. Формула не залежить від довжини сторони, лише від діагоналей."},
          circle:{ru:"Радиус равен половине высоты: во втором поле стоит диаметр, а не высота.", ua:"Радіус дорівнює половині висоти: у другому полі стоїть діаметр, а не висота."}
        };
        const LAB = {para:"a · h", tri:"½ · a · h", trap:"½ · (a + b) · h", rhomb:"½ · d₁ · d₂", circle:"π · R²"};
        let shape = "para";

        const btns = {};
        SHAPES.forEach(function(k){
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = NAME[k][lang];
          b.addEventListener("click", function(){
            shape = k;
            SHAPES.forEach(function(x){ btns[x].classList.toggle("active", x===k); });
            draw();
          });
          btns[k] = b;
          sw.appendChild(b);
        });

        function stats(){
          const a = +aIn.value, h = +hIn.value;
          if(shape === "para")  return {a:a, h:h, S:a*h,   fml:"S = a·h = " + a + "·" + h + " = " + fmt(a*h),   extra:[{k:"боковая сторона", v:fmt(Math.sqrt(h*h + 25))}]};
          if(shape === "tri")   return {a:a, h:h, S:a*h/2, fml:"S = ½·a·h = ½·" + a + "·" + h + " = " + fmt(a*h/2), extra:[{k:"периметр", v:fmt(a + h + Math.sqrt(a*a + h*h))}]};
          if(shape === "trap")  return {a:a, h:h, S:0.75*a*h, fml:"S = ½·(a+b)·h = ½·(" + a + "+" + fmt(a/2) + ")·" + h + " = " + fmt(0.75*a*h), extra:[{k:"b (верхнее основание)", v:fmt(a/2)}]};
          if(shape === "rhomb") return {a:a, h:h, S:a*h/2, fml:"S = ½·d₁·d₂ = ½·" + a + "·" + h + " = " + fmt(a*h/2), extra:[{k:"диагонали", v:a + " и " + h}]};
          const R = h/2;
          return {a:a, h:h, S:Math.PI*R*R, fml:"S = π·R² = π·(" + fmt(R) + ")² = " + fmt(Math.PI*R*R), extra:[{k:"R = h/2", v:fmt(R)},{k:"длина окружности", v:fmt(2*Math.PI*R)}]};
        }

        function draw(){
          const a = +aIn.value, h = +hIn.value;
          const s2 = 150/Math.max(a, h);
          s.innerHTML = "";
          s.appendChild(el("line",{x1:14, y1:250, x2:386, y2:250, stroke:cLine, "stroke-width":2}));

          if(shape === "para"){
            const sh = 40;
            const P = [{x:20,y:250},{x:20+a*s2,y:250},{x:20+a*s2+sh,y:250-h*s2},{x:20+sh,y:250-h*s2}];
            s.appendChild(el("polygon",{points:P.map(p=>p.x+","+p.y).join(" "), fill:cAccentSoft, "fill-opacity":0.8, stroke:"none"}));
            s.appendChild(el("polygon",{points:P.map(p=>p.x+","+p.y).join(" "), fill:"none", stroke:cInk, "stroke-width":2.5}));
            s.appendChild(el("line",{x1:20+sh, y1:250-h*s2, x2:20+sh, y2:250, stroke:COL.amber, "stroke-width":2, "stroke-dasharray":"4,3"}));
            rightAngle(s, 20+sh, 250, -1, -1, 10, COL.amber);
            text(s, "a", {x:(P[0].x+P[1].x)/2, y:272, fill:cInk, "font-size":14, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
            text(s, "h", {x:20+sh+12, y:250-h*s2/2, fill:COL.amber, "font-size":14, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
            text(s, "S = " + fmt(a*h), {x:250, y:110, fill:COL.blue, "font-size":19, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
          } else if(shape === "tri"){
            const T = [{x:20,y:250},{x:20+a*s2,y:250},{x:20+a*s2/2,y:250-h*s2}];
            s.appendChild(el("polygon",{points:T.map(p=>p.x+","+p.y).join(" "), fill:cTealSoft, "fill-opacity":0.85, stroke:"none"}));
            s.appendChild(el("polygon",{points:T.map(p=>p.x+","+p.y).join(" "), fill:"none", stroke:cInk, "stroke-width":2.5}));
            s.appendChild(el("line",{x1:T[2].x, y1:T[2].y, x2:T[2].x, y2:250, stroke:COL.amber, "stroke-width":2, "stroke-dasharray":"4,3"}));
            rightAngle(s, T[2].x, 250, -1, -1, 10, COL.amber);
            text(s, "a", {x:(T[0].x+T[1].x)/2, y:272, fill:cInk, "font-size":14, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
            text(s, "h", {x:T[2].x+13, y:250-h*s2/2, fill:COL.amber, "font-size":14, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
            text(s, "S = " + fmt(a*h/2), {x:250, y:110, fill:COL.teal, "font-size":19, "font-family":MONO, "text-anchor":"middle", "font-weight":700});
          } else if(shape === "trap"){

      function el(tag, at){ const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for(const k in at) n.setAttribute(k, at[k]); return n; }
      function text(s, str, at){ const n = el("text", at); n.textContent = str; s.appendChild(n); return n; }
      function fmt(x){ return Math.round(x*1000)/1000; }
      function seg(s, x1, y1, x2, y2, color, w, dash){
        const at = {x1:x1, y1:y1, x2:x2, y2:y2, stroke:color, "stroke-width":(w||2), "stroke-linecap":"round"};
        if(dash) at["stroke-dasharray"] = dash;
        s.appendChild(el("line", at));
      }
      function arrow(s, x1, y1, x2, y2, color, w, head){
        seg(s, x1, y1, x2, y2, color, w);
        const dx = x2-x1, dy = y2-y1, Ln = Math.hypot(dx, dy) || 1;
        const ux = dx/Ln, uy = dy/Ln, h = head || 10;
        const bx = x2 - ux*h, by = y2 - uy*h;
        seg(s, x2, y2, bx - uy*h*0.45, by + ux*h*0.45, color, w);
        seg(s, x2, y2, bx + uy*h*0.45, by - ux*h*0.45, color, w);
      }
      function rightAngle(s, x, y, sx, sy, size, color){
        seg(s, x, y, x + sx*size, y + sy*size, color, 2);

        const large = Math.abs(a2-a1) > Math.PI ? 1 : 0;

      function seg(s, x1, y1, x2, y2, color, w, dash){

        const NOTE = {

        function draw(){

          const bc = Math.sqrt(b*b + c*c - 2*b*c*cs);
          const proj = c*cs;

            lbl(s, "CM", (C.x+M.x)/2 + 16, (C.y+M.y)/2, COL.purple, "start", 12);

          let fml = "", cells = "";

          if(mode === "sides"){
            fml = "|BC| = \u221a(" + b + "\u00b2 + " + c + "\u00b2 \u2212 2\u00b7" + b + "\u00b7" + c + "\u00b7cos " + deg + "\u00b0) = " + fmt(bc);
            cells += "<div><span>BC</span>(" + fmt(c*cs - b) + "; " + fmt(c*sn) + ")</div>";
            cells += "<div><span>|BC|</span>" + fmt(bc) + "</div>";
            cells += "<div><span>AC \u2212 AB</span>= BC</div>";
          } else if(mode === "dot"){
            fml = AV + "B \u00b7 " + AV + "C = " + b + "\u00b7" + c + "\u00b7cos " + deg + "\u00b0 = " + fmt(dotv);
            cells += "<div><span>\u043f\u0440</span>" + fmt(proj) + "</div>";
            cells += "<div><span>AB\u20d7 \u00b7 AC\u20d7</span>" + fmt(dotv) + "</div>";
            cells += "<div><span>cos \u03b1</span>" + fmt(cs) + "</div>";

          cells += "<div class=\"wide note\">" + NOTE[mode][lang] + "</div>";
          out.innerHTML = cells;

        const a1 = Math.atan2(y1-cy, x1-cx), a2 = Math.atan2(y2-cy, x2-cx);
        let d = a2 - a1;
        while(d > Math.PI) d -= 2*Math.PI;
        while(d < -Math.PI) d += 2*Math.PI;
        const n = 18, pts = [];
        for(let i = 0; i <= n; i++){
          const a = a1 + d*i/n;
          pts.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
        }
        s.appendChild(el("polyline",{points:pts.join(" "), fill:"none", stroke:color, "stroke-width":(w||2), "stroke-linecap":"round"}));
      }
      function fmt(x){ return Math.round(x*100)/100; }
      function deg1(x){ return Math.round(x*10)/10; }
