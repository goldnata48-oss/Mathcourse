<!DOCTYPE html>
<!-- 2026 Наталия Кравченко. Все права защищены. Образовательный курс — «Маткурс» -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Страница не найдена · Маткурс</title>
<style>
  :root{--paper:#F5F6F7;--surface:#FFFFFF;--ink:#1D1F23;--ink-soft:#5B616B;--line:#E1E4E8;--accent:#33415C;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--serif:Iowan Old Style,Palatino Linotype,Georgia,serif;}
  @media (prefers-color-scheme:dark){:root{--paper:#18191C;--surface:#212327;--ink:#E7E9EC;--ink-soft:#9AA0AC;--line:#2C2F35;--accent:#8593AC;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px;text-align:center;}
  .code{font:700 72px/1 var(--serif);color:var(--accent);letter-spacing:2px;margin:0;}
  h1{font:700 24px/1.3 var(--serif);margin:14px 0 6px;}
  p{color:var(--ink-soft);margin:10px 0;}
  .home{display:inline-block;margin-top:22px;padding:12px 26px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font:600 15px var(--sans);}
  .home:hover{opacity:.9;}
  .ua{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<main class="wrap">
  <p class="code">404</p>
  <h1>Страница не найдена</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка.</p>
  <a class="home" href="./">На главную</a>

  <div class="ua" lang="uk">
    <h1 lang="uk">Сторінку не знайдено</h1>
    <p>Можливо, посилання застаріло або в адресі є помилка.</p>
    <a class="home" href="./">На головну</a>
  </div>
</main>
</body>
</html>
